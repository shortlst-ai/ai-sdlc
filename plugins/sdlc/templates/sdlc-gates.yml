# Rechecks every factory gate on each pull request. Make `gates` a required status
# check on the default branch, which is what turns it into a real merge gate.
#
# This uses pull_request_target so the workflow comes from the base branch. With
# pull_request, a change could edit this file and pass its own check. The cost is
# that this job must never run the pull request's code, so it only reads those
# files. Keep tests and builds in a separate pull_request workflow.
name: sdlc-gates
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git clone --depth 1 https://github.com/shortlst-ai/ai-sdlc "$RUNNER_TEMP/sdlc"
      - run: node "$RUNNER_TEMP/sdlc/plugins/sdlc/bin/sdlc" gates --base "origin/$GITHUB_BASE_REF"
