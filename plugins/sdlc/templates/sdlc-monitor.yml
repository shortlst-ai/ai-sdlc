# Watches CI on the default branch. When a workflow fails too often, this opens a
# pull request with a work item, so nobody has to notice the problem first. The
# item stops at the intent gate, so nothing gets built until a person approves.
#
# Detection is plain code and needs no API key. Add an ANTHROPIC_API_KEY secret to
# have a read-only agent add a likely cause. Allow GitHub Actions to create pull
# requests in the repo's settings, or the last step fails.
#
# It reads runs on the default branch, so your CI must run on pushes there as well
# as on pull requests. If it doesn't, `sdlc detect` says there's nothing to judge.
name: sdlc-monitor
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git clone --depth 1 https://github.com/shortlst-ai/ai-sdlc "$RUNNER_TEMP/sdlc"
      - run: echo "$RUNNER_TEMP/sdlc/plugins/sdlc/bin" >> "$GITHUB_PATH"
      - name: Stop if a breach is already open
        id: open
        run: echo "count=$(gh pr list --label sdlc-breach --state open --json number --jq length)" >> "$GITHUB_OUTPUT"
      - name: Detect
        if: steps.open.outputs.count == '0'
        run: |
          gh run list --branch "$BRANCH" --limit 200 \
            --json workflowName,conclusion,headBranch,createdAt,displayTitle,url > "$RUNNER_TEMP/runs.json"
          sdlc detect --runs "$RUNNER_TEMP/runs.json" --branch "$BRANCH"
      - name: Open work items
        id: breach
        if: steps.open.outputs.count == '0'
        run: |
          git switch -c "sdlc/breach-$GITHUB_RUN_ID"
          sdlc breach --runs "$RUNNER_TEMP/runs.json" --branch "$BRANCH" --json > "$RUNNER_TEMP/created.json"
          echo "created=$(jq '.created | length' "$RUNNER_TEMP/created.json")" >> "$GITHUB_OUTPUT"
      - name: Diagnose
        if: steps.breach.outputs.created != '0' && steps.breach.outputs.created != '' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          for id in $(jq -r '.created[]' "$RUNNER_TEMP/created.json"); do
            claude -p "/sdlc:diagnose $id" --plugin-dir "$RUNNER_TEMP/sdlc/plugins/sdlc" \
              --allowedTools 'Read,Grep,Glob,Agent,Edit,Bash(gh run view *),Bash(sdlc *),Bash(git *)'
          done
      - name: Open the pull request
        if: steps.breach.outputs.created != '0' && steps.breach.outputs.created != ''
        run: |
          git config user.name 'sdlc-monitor'
          git config user.email 'sdlc-monitor@users.noreply.github.com'
          git add .sdlc
          git commit -m 'Open work items for CI breaches'
          git push origin HEAD
          gh label create sdlc-breach --force --description 'Opened by sdlc-monitor'
          gh pr create --label sdlc-breach --title 'CI failing too often' \
            --body 'Opened by `sdlc-monitor`. See `intent.md` in `.sdlc/work/`. Nothing gets built until a person types `/sdlc:approve`.'
